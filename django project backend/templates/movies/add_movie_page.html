<!DOCTYPE html>
<html>
<head>
    <title>Add Movie</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h2 { color: #333; }
        form { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 12px; }
        input[type="text"], select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 18px; padding: 10px 24px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; }
        button:hover { background: #1558b0; }
        .msg-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 15px; }
        .msg-error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 15px; font-weight: bold; }
        .nav-links { margin-top: 20px; }
        .nav-links a { color: #1a73e8; margin-right: 12px; text-decoration: none; }
        .nav-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h2>Add a Movie Manually</h2>

    {% if message %}
        <div class="msg-success">{{ message }}</div>
    {% endif %}
    {% if error %}
        <div class="msg-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Title:</label>
        <input type="text" name="title" required value="{{ request.POST.title }}">

        <label>Type:</label>
        <select name="type">
            <option value="Movie">Movie</option>
            <option value="TV Show">TV Show</option>
        </select>

        <label>Release Year:</label>
        <select name="release_year">
            {% for year in years %}
                <option value="{{ year }}">{{ year }}</option>
            {% endfor %}
        </select>

        <label>Director:</label>
        <input type="text" name="director">

        <label>Cast:</label>
        <input type="text" name="cast">

        <label>Country:</label>
        <input type="text" name="country">

        <label>Genre (listed_in):</label>
        <input type="text" name="listed_in">

        <button type="submit">Add Movie</button>
    </form>

    <div class="nav-links">
        <a href="/movies-page/">🎬 Movies List</a>
        <a href="/fetch-page/">📥 Fetch Movies</a>
        <a href="/search-movie/">🔍 Search DB</a>
        <a href="/api-search/">🌐 Search API</a>
    </div>
</body>
</html>
